name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build before tests: some route tests serve built widget assets from dist-web.
      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test

  database:
    name: Migrations and DB tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      SUPABASE_URL: http://127.0.0.1:55321
      SUPABASE_AUTH_ISSUER: http://127.0.0.1:55321/auth/v1
      SUPABASE_JWKS_URL: http://127.0.0.1:55321/auth/v1/.well-known/jwks.json
      SUPABASE_JWT_AUDIENCE: authenticated
      SUPABASE_ANON_KEY: local-anon-key
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test:db runs the whole tests/platform suite, including route tests that serve
      # built widget assets from dist-web — build them before the tests run.
      - name: Build web assets
        run: pnpm build:web

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Validate migrations apply cleanly
        run: pnpm migrations:check

      - name: Database integration tests
        run: pnpm test:db
